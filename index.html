<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>Anime Vinyl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anime Vinyl">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 播放視圖 ============ -->
<main id="viewPlay" hidden>
  <div class="play-wrap" id="playWrap">
    <div class="top-bar">
      <a class="back-link" id="backLink" href="#home" hidden>← 首頁</a>
      
      <div class="play-top-actions">
        <button class="drawer-toggle" id="fsBtn" type="button" hidden aria-label="全螢幕">⛶</button>
        <button class="drawer-toggle" id="listToggle" type="button">☰ 歌單</button>
        <button class="icon-btn danger" id="deletePlayBtn" type="button" style="margin-left: 8px; display: none;" title="刪除歌單" aria-label="刪除歌單">🗑️</button>
        
        <div class="user-area" style="margin-left: 10px;">
          <button id="loginBtnPlay" class="btn-google" style="padding: 6px 12px; font-size: 12px;">登入</button>
          <div id="userProfilePlay" class="user-profile" hidden>
            <img id="userAvatarPlay" src="" alt="User">
            <div id="userDropdownPlay" class="user-dropdown" hidden>
              <div class="dropdown-header">
                <span id="userNamePlay">載入中...</span>
              </div>
              <button class="dropdown-item play-logout-btn">登出</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="plinth-wrapper">
      <button type="button" class="nav-arrow left" id="prevArrow" aria-label="上一首">❮</button>
      <div class="plinth" id="vinylPlinth">
        <div class="vinyl-swing">
        <div class="vinyl">
          <div class="label" id="label"></div>
          <div class="spindle"></div>
        </div>
        </div>
        <div class="sheen"></div>
        <div class="tonearm" id="tonearm">
          <div class="arm-base"></div>
          <div class="arm-rod"></div>
          <div class="arm-head"></div>
        </div>
      </div>
      <button type="button" class="nav-arrow right" id="nextArrow" aria-label="下一首">❯</button>
    </div>
    <div class="meta">
      <p class="anime" id="anime"></p>
      <h1 class="title" id="title"></h1>
      <p class="artist" id="artist"></p>
    </div>
    <div class="eq" id="eq" aria-hidden="true"></div>
    <div class="progress-area">
      <div class="progress">
        <div class="seek" id="seek"><div class="bar"><div class="fill" id="fill"></div></div><div class="thumb" id="thumb"></div></div>
        <div class="times">
          <span id="cur">0:00</span>
          <span id="dur">0:00</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="prevBtn" type="button" aria-label="上一首">⏮</button>
      <button class="btn primary" id="playBtn" type="button" aria-label="播放／暫停">▶</button>
      <button class="btn" id="nextBtn" type="button" aria-label="下一首">⏭</button>
    </div>
    <div class="extras">
      <button class="pill" id="modeBtn" type="button" aria-label="播放模式">➡️ 順序</button>
      <button class="pill" id="sleepBtn" type="button" aria-label="睡眠定時">😴 定時</button>
      <button class="pill" id="themeBtn" type="button" aria-label="外觀主題">🎨 外觀</button>
    </div>
  </div>
  <div class="drawer-overlay" id="playlistDrawer" hidden>
    <div class="drawer">
      <div class="drawer-head">
        <h2 id="drawerTitle"></h2>
        <button class="drawer-close" id="drawerClose" type="button">✕</button>
      </div>
      <div class="drawer-list" id="drawerList"></div>
    </div>
  </div>
</main>

<!-- ============ 首頁 (包含歡迎畫面與會員總覽) ============ -->
<main id="viewHome" hidden>
  <div class="edit-wrap">
    <div class="edit-topbar">
      <div class="edit-header-left">
        <h1>Anime Vinyl</h1>
      </div>
      <div class="user-area" id="homeUserArea" hidden>
        <div id="userProfile" class="user-profile" hidden>
          <img id="userAvatar" src="" alt="User">
          <div id="userDropdown" class="user-dropdown" hidden>
            <div class="dropdown-header">
              <span id="userName">載入中...</span>
              <span id="userEmail" class="text-muted">...</span>
            </div>
            <button id="logoutBtn" class="dropdown-item">登出</button>
            <button id="deleteAccountBtn" class="dropdown-item danger">刪除帳號</button>
          </div>
        </div>
      </div>
    </div>

    <div id="guestHome" hidden>
      <div class="guest-hero">
        <div class="glowing-vinyl">
          <div class="vinyl-inner"></div>
        </div>
      </div>
      <h2 class="guest-title">歡迎來到 Anime Vinyl</h2>
      <p class="guest-desc">
        掃描海報上的 NFC 標籤，或是開啟朋友分享的連結，即可體驗專屬的復古黑膠播放器。
      </p>
      <button class="btn-block primary" id="guestLoginBtn" style="margin-top: 30px; font-size: 18px; padding: 18px;">
        登入以編輯你的歌單
      </button>
    </div>

    <div id="memberHome" hidden>
      <div class="list-actions">
        <button class="btn-block primary" id="createPlaylistBtn" type="button">＋ 建立新歌單</button>
      </div>
      <div class="playlist-grid" id="playlistGrid"></div>
    </div>

    <div id="templateSection" hidden>
      <h2 class="section-title">範本歌單</h2>
      <div class="playlist-grid" id="templateList"></div>
    </div>

    <div id="historySection" hidden>
      <h2 class="section-title">最近播放（分享連結 / NFC）</h2>
      <div class="playlist-grid" id="historyList"></div>
    </div>
  </div>
</main>

<!-- ============ 編輯視圖 ============ -->
<main id="viewEdit" hidden>
  <div class="edit-wrap" id="editWrap">
    <div class="edit-topbar">
      <div class="edit-header-left">
        <a href="#home" class="back-link" style="position:static; padding: 0;">← 首頁</a>
      </div>
      <div class="edit-header-right">
        <span id="saveStatus" class="save-status"></span>
        <button class="btn-save" id="saveBtn">儲存</button>
        <button class="icon-btn danger" id="deleteEditBtn" type="button" title="刪除歌單" aria-label="刪除歌單" style="margin-left: 8px;">🗑️</button>
      </div>
    </div>

    <label class="field" style="margin-top: 10px;">
      <span>歌單名稱</span>
      <input id="playlistName" type="text" maxlength="40" placeholder="請輸入歌單名稱">
    </label>

    <div id="songEditorList" class="song-list"></div>

    <button class="btn-block ghost" id="addSongBtn" type="button">＋ 新增歌曲</button>

    <div class="actions" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
      <button class="btn-block" id="previewBtn" type="button">▶ 預覽播放</button>
      <button class="btn-block primary" id="shareBtn" type="button">🔗 生成分享連結</button>
    </div>

    <div class="share-box" id="shareBox" hidden>
      <label class="field">
        <span>分享連結（只讀播放）</span>
        <textarea id="shareUrl" readonly rows="3"></textarea>
      </label>
      <button class="btn-block" id="copyBtn" type="button">複製連結</button>
      <p class="share-info" id="shareInfo"></p>
    </div>
  </div>
</main>

<!-- ============ 錯誤視圖 ============ -->
<main id="viewError" hidden>
  <div class="error-wrap">
    <p class="err" id="errorMsg"></p>
    <a class="back" href="#home">← 回到首頁</a>
  </div>
</main>

<!-- ============ 自訂確認彈窗 (Modal) ============ -->
<div class="modal-overlay" id="deleteModal" hidden>
  <div class="modal-content">
    <h3>刪除歌單</h3>
    <p>執行後此歌單將整個刪除無法復原，<br>確定要刪除嗎？</p>
    <div class="modal-actions">
      <button class="btn-block ghost" id="cancelDeleteBtn">取消</button>
      <button class="btn-block danger" id="confirmDeleteBtn">確定刪除</button>
    </div>
  </div>
</div>

<!-- ============ 外觀主題 ============ -->
<div class="modal-overlay" id="themeModal" hidden>
  <div class="modal-content theme-panel">
    <h3>🎨 外觀</h3>
    <p class="theme-label">主題色</p><div class="swatches" id="accentSwatches"></div>
    <p class="theme-label">唱片顏色</p><div class="swatches" id="vinylSwatches"></div>
    <p class="theme-label">中央標籤</p><div class="seg" id="labelSeg"></div>
    <div class="modal-actions" style="margin-top:20px"><button class="btn-block primary" id="themeDone" type="button">完成</button></div>
  </div>
</div>

<!-- ============ 吃掉動畫容器 ============ -->
<div class="eat-animation-overlay" id="eatOverlay" hidden>
  <div class="monster" id="monster">
    <div class="monster-eye left"></div>
    <div class="monster-eye right"></div>
    <div class="monster-mouth" id="monsterMouth"></div>
  </div>
</div>

<div id="ytHost" aria-hidden="true"></div>
<div class="tap-prompt" id="tapPrompt" hidden><span>▶ 點一下開始播放</span></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js" defer></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, deleteUser, signInWithRedirect, reauthenticateWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { initializeFirestore, doc, setDoc, getDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB1r6uz7hRPjZz3Ha5YJVRG28vt0B31MVo",
    authDomain: "musicddjason.firebaseapp.com",
    projectId: "musicddjason",
    storageBucket: "musicddjason.firebasestorage.app",
    messagingSenderId: "593507167093",
    appId: "1:593507167093:web:c02484cc34d5d20432c13c",
    measurementId: "G-WSYF3Z0BPE"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
    const provider = new GoogleAuthProvider();
    
    // 加入了 onSnapshot
    window.firebaseAuth = { auth, provider, signInWithPopup, signOut, onAuthStateChanged, deleteUser, signInWithRedirect, reauthenticateWithPopup };
    window.firebaseDB = { db, doc, setDoc, getDoc, deleteDoc, onSnapshot };
    
    window.dispatchEvent(new Event('firebaseReady'));
  } catch (e) {
    console.error("Firebase 初始化失敗", e);
  }
</script>
<script src="app.js" defer></script>
</body>
</html>
