<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑膠唱片播放器 - 外觀設定版</title>
    <style>
        :root {
            --primary-color: #333;
            --accent-color: #e74c3c;
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s;
        }

        /* 主容器 */
        .player-container {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
            position: relative;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--text-color);
        }

        /* 唱片區域 */
        .record-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
        }

        .vinyl-record {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #444, #000);
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s ease-out; /* 平滑過渡 */
        }

        /* 唱片紋理 */
        .vinyl-record::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.1);
        }

        /* 唱片標籤 (可變色部分) */
        .record-label {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--accent-color); /* 默認紅色 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: white;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            transition: background-color 0.2s; /* 顏色變化過渡 */
        }

        /* 旋轉動畫類 */
        .spinning {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 控制按鈕區 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            outline: none;
        }

        .btn-play {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-play:hover {
            transform: scale(1.05);
        }

        /* 外觀設定按鈕 */
        .btn-settings {
            background-color: transparent;
            border: 2px solid #ddd;
            color: #666;
            font-size: 14px;
        }

        .btn-settings:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* --- 彈出式設定面板 (Modal) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .settings-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 280px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .settings-panel {
            transform: translateY(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .settings-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
            padding: 0;
        }

        .setting-item {
            margin-bottom: 15px;
            text-align: left;
        }

        .setting-item label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        /* 自定義顏色輸入框樣式 */
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }
        
        /* 預設顏色選項 */
        .color-presets {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .preset-color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        
        .preset-color:hover {
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <div class="player-container">
        <h2>Vinyl Player</h2>
        
        <div class="record-wrapper">
            <div class="vinyl-record" id="record">
                <div class="record-label" id="recordLabel">
                    MUSIC
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-play" id="playBtn">播放 / 暫停</button>
        </div>
        
        <!-- 新增：外觀設定按鈕 -->
        <button class="btn-settings" id="openSettingsBtn">🎨 外觀設定</button>
    </div>

    <!-- 彈出式設定面板 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="settings-panel">
            <div class="settings-header">
                <h3>外觀設定</h3>
                <button class="close-btn" id="closeSettingsBtn">&times;</button>
            </div>
            
            <div class="setting-item">
                <label>唱片標籤顏色</label>
                <!-- 顏色選擇器 -->
                <input type="color" id="colorPicker" value="#e74c3c">
                
                <!-- 快速預設顏色 -->
                <div class="color-presets">
                    <div class="preset-color" style="background: #e74c3c;" data-color="#e74c3c"></div>
                    <div class="preset-color" style="background: #3498db;" data-color="#3498db"></div>
                    <div class="preset-color" style="background: #2ecc71;" data-color="#2ecc71"></div>
                    <div class="preset-color" style="background: #f1c40f;" data-color="#f1c40f"></div>
                    <div class="preset-color" style="background: #9b59b6;" data-color="#9b59b6"></div>
                </div>
            </div>
            
            <div class="setting-item">
                <label>背景主題</label>
                <select id="themeSelect" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
                    <option value="light">淺色模式</option>
                    <option value="dark">深色模式</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        // 獲取元素
        const record = document.getElementById('record');
        const recordLabel = document.getElementById('recordLabel');
        const playBtn = document.getElementById('playBtn');
        
        // 設定面板相關元素
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const colorPicker = document.getElementById('colorPicker');
        const presetColors = document.querySelectorAll('.preset-color');
        const themeSelect = document.getElementById('themeSelect');

        let isPlaying = false;

        // 播放/暫停邏輯
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                record.classList.add('spinning');
                playBtn.textContent = '暫停';
            } else {
                record.classList.remove('spinning');
                playBtn.textContent = '播放';
            }
        });

        // --- 設定面板邏輯 ---

        // 1. 打開面板
        openSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('active');
        });

        // 2. 關閉面板 (點擊 X)
        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        // 3. 關閉面板 (點擊背景遮罩)
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('active');
            }
        });

        // 4. 即時改變顏色 (Color Picker)
        colorPicker.addEventListener('input', (e) => {
            const newColor = e.target.value;
            updateRecordColor(newColor);
        });

        // 5. 快速預設顏色點擊
        presetColors.forEach(preset => {
            preset.addEventListener('click', () => {
                const color = preset.getAttribute('data-color');
                // 同步更新 Color Picker 的值
                colorPicker.value = color;
                updateRecordColor(color);
            });
        });

        // 輔助函數：更新唱片顏色
        function updateRecordColor(color) {
            // 修改 CSS 變量或直接修改樣式
            recordLabel.style.backgroundColor = color;
            // 也可以稍微調整陰影顏色讓它看起來更融合
            recordLabel.style.boxShadow = `inset 0 0 10px rgba(0,0,0,0.2), 0 0 15px ${color}40`;
        }

        // 6. 主題切換 (簡單示範)
        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            if (theme === 'dark') {
                document.body.style.backgroundColor = '#2c3e50';
                document.querySelector('.player-container').style.backgroundColor = '#34495e';
                document.querySelector('.player-container').style.color = '#ecf0f1';
                document.documentElement.style.setProperty('--text-color', '#ecf0f1');
            } else {
                document.body.style.backgroundColor = '#f0f2f5';
                document.querySelector('.player-container').style.backgroundColor = '#ffffff';
                document.querySelector('.player-container').style.color = '#333';
                document.documentElement.style.setProperty('--text-color', '#333');
            }
        });

    </script>
</body>
</html>
