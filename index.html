<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>Anime Vinyl</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 播放視圖 ============ -->
<main id="viewPlay" hidden>
  <div class="play-wrap">
    <div class="top-bar">
      <a class="back-link" id="backLink" href="#edit" hidden>← 編輯</a>
      <button class="drawer-toggle" id="listToggle" type="button">☰ 歌單</button>
    </div>
    <div class="plinth-wrapper">
      <div class="nav-arrow left" id="prevArrow">❮</div>
      <div class="plinth" id="vinylPlinth">
        <div class="vinyl">
          <div class="label" id="label"></div>
          <div class="spindle"></div>
        </div>
        <div class="sheen"></div>
        <div class="tonearm" id="tonearm">
          <div class="arm-base"></div>
          <div class="arm-rod"></div>
          <div class="arm-head"></div>
        </div>
      </div>
      <div class="nav-arrow right" id="nextArrow">❯</div>
    </div>
    <div class="meta">
      <p class="anime" id="anime"></p>
      <h1 class="title" id="title"></h1>
      <p class="artist" id="artist"></p>
    </div>
    <div class="progress-area">
      <div class="progress">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="times">
          <span id="cur">0:00</span>
          <span id="dur">0:00</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="prevBtn" type="button" aria-label="上一首">⏮</button>
      <button class="btn primary" id="playBtn" type="button" aria-label="播放／暫停">▶</button>
      <button class="btn" id="nextBtn" type="button" aria-label="下一首">⏭</button>
    </div>
  </div>
  <div class="drawer-overlay" id="playlistDrawer" hidden>
    <div class="drawer">
      <div class="drawer-head">
        <h2 id="drawerTitle"></h2>
        <button class="drawer-close" id="drawerClose" type="button">✕</button>
      </div>
      <div class="drawer-list" id="drawerList"></div>
    </div>
  </div>
</main>

<!-- ============ 編輯視圖 ============ -->
<main id="viewEdit" hidden>
  <div class="edit-wrap">
    <header class="edit-header">
      <h1>Anime Vinyl</h1>
      <p>製作你的黑膠歌單</p>
    </header>

    <!-- 登入登出區塊 -->
    <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 8px;">
      <button id="loginBtn" class="btn-block" style="padding: 10px; width: auto; font-size: 14px; display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Google 登入
      </button>
      <button id="logoutBtn" class="btn-block ghost" style="padding: 10px; width: auto; font-size: 14px; display: none;">登出</button>
      <span id="userInfo" style="font-size: 13px; color: var(--accent); display: none;"></span>
    </div>

    <label class="field">
      <span>歌單名稱</span>
      <input id="playlistName" type="text" maxlength="40" placeholder="我的動漫收藏">
    </label>

    <div id="songEditorList" class="song-list"></div>

    <button class="btn-block ghost" id="addSongBtn" type="button">＋ 新增歌曲</button>

    <div class="actions">
      <button class="btn-block" id="previewBtn" type="button">▶ 預覽播放</button>
      <button class="btn-block primary" id="shareBtn" type="button">🔗 生成分享連結</button>
    </div>

    <div class="share-box" id="shareBox" hidden>
      <label class="field">
        <span>分享連結（只讀播放）</span>
        <textarea id="shareUrl" readonly rows="3"></textarea>
      </label>
      <button class="btn-block" id="copyBtn" type="button">複製連結</button>
      <p class="share-info" id="shareInfo"></p>
    </div>
  </div>
</main>

<!-- ============ 錯誤視圖 ============ -->
<main id="viewError" hidden>
  <div class="error-wrap">
    <p class="err" id="errorMsg"></p>
    <a class="back" href="#edit">← 回到編輯</a>
  </div>
</main>

<div id="ytHost" aria-hidden="true"></div>
<div class="tap-prompt" id="tapPrompt" hidden><span>▶ 點一下開始播放</span></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB1r6uz7hRPjZz3Ha5YJVRG28vt0B31MVo",
    authDomain: "musicddjason.firebaseapp.com",
    projectId: "musicddjason",
    storageBucket: "musicddjason.firebasestorage.app",
    messagingSenderId: "593507167093",
    appId: "1:593507167093:web:c02484cc34d5d20432c13c",
    measurementId: "G-WSYF3Z0BPE"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

  }
</script>

<!-- 加上 defer 確保 DOM 載入完才執行 -->
<script src="app.js" defer></script>
</body>
</html>
